<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>PyCode Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0D1117;
    --bg-2: #111826;
    --surface: #1A2233;
    --line: #26314A;
    --ink: #E6EDF3;
    --ink-dim: #8B96AC;
    --accent: #5FD3A6;
    --accent-dim: #2E6B52;
    --user-bubble: #223047;
    --code-bg: #0B0F19;
    --radius-lg: 20px;
    --radius-sm: 6px;
  }

  *{ box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body{ height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: 'Cairo', sans-serif; }

  body{
    display: flex; justify-content: center;
    background: radial-gradient(1100px 550px at 50% -10%, rgba(95,211,166,0.06), transparent 60%), var(--bg);
  }

  .app{
    width: 100%; max-width: 480px; height: 100dvh;
    display: flex; flex-direction: column;
    background: var(--bg-2); border-inline: 1px solid var(--line);
  }

  header{
    flex: 0 0 auto; display: flex; align-items: center; gap: 12px;
    padding: 16px 18px; border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 5; background: var(--bg-2);
  }
  .avatar{
    width: 42px; height: 42px; border-radius: 14px;
    background: linear-gradient(135deg, var(--accent), #2E9E71);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; flex-shrink: 0; box-shadow: 0 4px 14px rgba(95,211,166,0.25);
  }
  .title-block{ display:flex; flex-direction: column; gap: 2px; min-width:0; }
  .title-block h1{ margin:0; font-size: 16.5px; font-weight: 700; }
  .status{ display:flex; align-items:center; gap:6px; font-size: 12.5px; color: var(--ink-dim); font-weight: 500; }
  .status .dot{ width:6px; height:6px; border-radius:50%; background:#4CC38A; box-shadow: 0 0 0 3px rgba(76,195,138,0.15); }
  .disclaimer{
    margin-inline-start:auto; font-size: 10.5px; color: var(--accent);
    border: 1px solid var(--accent-dim); background: rgba(95,211,166,0.08);
    padding: 4px 9px; border-radius: 999px; white-space: nowrap;
  }

  .messages{
    flex: 1 1 auto; overflow-y: auto; padding: 18px 14px 8px;
    display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth;
  }
  .row{ display:flex; width:100%; flex-direction: column; }
  .row.user{ align-items: flex-end; }
  .row.bot{ align-items: flex-start; }

  .bubble{ max-width: 90%; padding: 11px 15px; font-size: 14.5px; line-height: 1.7; word-wrap: break-word; }
  .bubble.user{
    background: var(--user-bubble); color: var(--ink);
    border-radius: var(--radius-lg) var(--radius-sm) var(--radius-lg) var(--radius-lg);
    white-space: pre-wrap;
  }
  .bubble.bot{
    background: transparent; padding: 0; max-width: 100%;
  }

  .code-card{
    background: var(--code-bg); border: 1px solid var(--line);
    border-inline-start: 3px solid var(--accent);
    border-radius: var(--radius-sm) var(--radius-lg) var(--radius-lg) var(--radius-lg);
    overflow: hidden; width: 100%;
  }
  .code-card .code-head{
    display:flex; align-items:center; justify-content: space-between;
    padding: 7px 12px; font-size: 11px; color: var(--ink-dim);
    border-bottom: 1px solid var(--line); font-family: 'JetBrains Mono', monospace;
  }
  .code-card pre{
    margin: 0; padding: 13px 15px; overflow-x: auto;
    font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.6;
    direction: ltr; text-align: left; color: #C9D1D9;
  }
  .copy-btn{
    background: none; border: none; color: var(--ink-dim); cursor: pointer;
    font-family: 'Cairo', sans-serif; font-size: 11px; padding: 2px 6px;
  }
  .copy-btn:hover{ color: var(--accent); }

  .cursor{
    display: inline-block; width: 7px; height: 14px; background: var(--accent);
    margin-inline-start: 2px; vertical-align: middle; animation: blink 0.9s step-start infinite;
  }
  @keyframes blink{ 50%{ opacity: 0; } }

  .thinking{ display: flex; align-items: center; gap: 5px; padding: 13px 16px; }
  .thinking span{
    width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
    opacity: 0.35; animation: bounce 1.1s infinite ease-in-out;
  }
  .thinking span:nth-child(2){ animation-delay: 0.15s; }
  .thinking span:nth-child(3){ animation-delay: 0.3s; }
  @keyframes bounce{
    0%, 80%, 100% { transform: translateY(0); opacity: 0.35; }
    40% { transform: translateY(-4px); opacity: 1; }
  }

  .retry-btn{
    margin-top: 6px; align-self: flex-start; font-family: 'Cairo', sans-serif;
    font-size: 11.5px; color: var(--ink-dim); background: transparent;
    border: 1px solid var(--line); padding: 5px 11px; border-radius: 999px; cursor: pointer;
  }
  .retry-btn:hover{ color: var(--accent); border-color: var(--accent-dim); }

  .empty-state{ margin: auto; text-align: center; color: var(--ink-dim); padding: 30px 20px; }
  .empty-state .glyph{ font-size: 34px; margin-bottom: 10px; }
  .empty-state h2{ font-size: 15px; color: var(--ink); font-weight: 700; margin: 0 0 6px; }
  .empty-state p{ font-size: 13px; line-height: 1.7; margin: 0; }
  .suggestions{ display:flex; flex-wrap: wrap; gap:8px; justify-content:center; margin-top:16px; }
  .suggestions button{
    font-family: 'Cairo', sans-serif; font-size: 12px; color: var(--ink);
    background: var(--surface); border: 1px solid var(--line);
    padding: 8px 13px; border-radius: 999px; cursor: pointer;
  }

  .composer{
    flex: 0 0 auto; display: flex; align-items: flex-end; gap: 10px;
    padding: 12px 14px calc(12px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); background: var(--bg-2);
  }
  .composer textarea{
    flex: 1; resize: none; max-height: 120px; min-height: 46px;
    padding: 12px 16px; font-family: 'Cairo', sans-serif; font-size: 14.5px;
    color: var(--ink); background: var(--surface); border: 1px solid var(--line);
    border-radius: 20px; outline: none; line-height: 1.5;
  }
  .composer textarea::placeholder{ color: var(--ink-dim); }
  .composer textarea:focus{ border-color: var(--accent-dim); }
  .send-btn{
    flex: 0 0 auto; width: 46px; height: 46px; border-radius: 50%; border: none;
    background: var(--accent); color: #0A1F16; display: flex; align-items: center;
    justify-content: center; cursor: pointer;
  }
  .send-btn:active{ transform: scale(0.92); }
  .send-btn:disabled{ opacity: 0.4; cursor: default; }
  .send-btn svg{ width: 19px; height: 19px; transform: scaleX(-1); }

  .messages::-webkit-scrollbar{ width: 5px; }
  .messages::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 10px; }
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="avatar">🐍</div>
    <div class="title-block">
      <h1>PyCode Assistant</h1>
      <div class="status"><span class="dot"></span> جاهز لتوليد كود بايثون</div>
    </div>
    <div class="disclaimer">نموذج تعليمي</div>
  </header>

  <div class="messages" id="messages">
    <div class="empty-state" id="emptyState">
      <div class="glyph">🐍</div>
      <h2>اكتب وصف الكود بالإنجليزية</h2>
      <p>مساعد تجريبي مبني على Transformer صغير مدرَّب من الصفر على CoNaLa،<br>فقد يولّد كودًا غير صحيح نحويًا أحيانًا.</p>
      <div class="suggestions">
        <button type="button" data-q="reverse a list in python">reverse a list</button>
        <button type="button" data-q="read a file line by line">read a file</button>
        <button type="button" data-q="sort a dictionary by value">sort a dict</button>
      </div>
    </div>
  </div>

  <form class="composer" id="composer">
    <textarea id="input" rows="1" placeholder="e.g. reverse a list in python" autocomplete="off"></textarea>
    <button type="submit" class="send-btn" id="sendBtn" aria-label="إرسال">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 12L20 4L14 20L11 13L4 12Z" fill="currentColor"/>
      </svg>
    </button>
  </form>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const emptyState = document.getElementById('emptyState');
  const form = document.getElementById('composer');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  let busy = false;

  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });

  document.querySelectorAll('.suggestions button').forEach(btn => {
    btn.addEventListener('click', () => { input.value = btn.dataset.q; form.requestSubmit(); });
  });

  function scrollToBottom(){ messagesEl.scrollTop = messagesEl.scrollHeight; }

  function addUserBubble(text){
    if (emptyState) emptyState.remove();
    const row = document.createElement('div');
    row.className = 'row user';
    row.innerHTML = `<div class="bubble user"></div>`;
    row.querySelector('.bubble').textContent = text;
    messagesEl.appendChild(row);
    scrollToBottom();
  }

  function addThinkingRow(){
    const row = document.createElement('div');
    row.className = 'row bot';
    row.innerHTML = `<div class="bubble bot"><div class="code-card"><div class="thinking"><span></span><span></span><span></span></div></div></div>`;
    messagesEl.appendChild(row);
    scrollToBottom();
    return row;
  }

  function copyCode(btn, codeEl){
    navigator.clipboard.writeText(codeEl.textContent).then(() => {
      const old = btn.textContent;
      btn.textContent = '✓ Copied';
      setTimeout(() => { btn.textContent = old; }, 1500);
    });
  }

  async function streamInto(intent, row){
    row.innerHTML = `<div class="bubble bot"><div class="code-card"><div class="thinking"><span></span><span></span><span></span></div></div></div>`;
    scrollToBottom();

    let started = false;
    let codeEl = null;
    let fullText = '';

    try{
      const res = await fetch('/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: intent })
      });
      if (!res.body) throw new Error('لا يدعم المتصفح البث');

      const reader = res.body.getReader();
      const decoder = new TextDecoder('utf-8');

      while (true){
        const { value, done } = await reader.read();
        if (done) break;
        const chunk = decoder.decode(value, { stream: true });
        if (!chunk) continue;

        if (!started){
          row.innerHTML = `
            <div class="bubble bot">
              <div class="code-card">
                <div class="code-head"><span>python</span><button type="button" class="copy-btn">Copy</button></div>
                <pre><code class="code-text"></code><span class="cursor"></span></pre>
              </div>
            </div>`;
          codeEl = row.querySelector('.code-text');
          const copyBtn = row.querySelector('.copy-btn');
          copyBtn.addEventListener('click', () => copyCode(copyBtn, codeEl));
          started = true;
        }
        fullText += chunk;
        codeEl.textContent = fullText;
        scrollToBottom();
      }

      if (!started){
        row.innerHTML = `<div class="bubble bot"><div class="code-card"><pre>لم أستطع توليد كود، حاول صياغة أوضح.</pre></div></div>`;
      } else {
        const cursor = row.querySelector('.cursor');
        if (cursor) cursor.remove();
        if (!fullText.trim()){
          codeEl.textContent = '# لم يتمكن النموذج من توليد كود لهذا الوصف';
        }
      }
    } catch (err){
      row.innerHTML = `<div class="bubble bot"><div class="code-card"><pre>تعذّر الاتصال بالخادم.</pre></div></div>`;
    } finally {
      appendRetryButton(row, intent);
    }
  }

  function appendRetryButton(row, intent){
    const retry = document.createElement('button');
    retry.type = 'button';
    retry.className = 'retry-btn';
    retry.innerHTML = '↻ إعادة المحاولة';
    retry.addEventListener('click', async () => {
      if (busy) return;
      busy = true; sendBtn.disabled = true;
      await streamInto(intent, row);
      busy = false; sendBtn.disabled = false;
    });
    row.appendChild(retry);
    scrollToBottom();
  }

  async function sendMessage(intent){
    if (busy || !intent.trim()) return;
    busy = true; sendBtn.disabled = true;

    addUserBubble(intent);
    input.value = '';
    input.style.height = 'auto';

    const row = addThinkingRow();
    await streamInto(intent, row);

    busy = false; sendBtn.disabled = false;
  }

  form.addEventListener('submit', (e) => { e.preventDefault(); sendMessage(input.value); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); form.requestSubmit(); }
  });
</script>

</body>
</html>
